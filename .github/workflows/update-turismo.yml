name: Aggiorna dati turismo Veneto

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/update-turismo.yml"
  schedule:
    - cron: "17 5 * * 2"
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/update-turismo.yml"

permissions:
  contents: write

concurrency:
  group: update-turismo-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Scarica, normalizza e valida
        run: python scripts/update_regione_veneto.py

      - name: Test automatici
        run: python -m unittest discover -s tests -v

      - name: Pubblica solo dati validati
        if: github.event_name != 'pull_request'
        run: |
          if [ -z "$(git status --porcelain -- data/raw data/processed)" ]; then
            echo "Nessun nuovo dato da pubblicare."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw data/processed
          git commit -m "Aggiorna dati turismo Regione Veneto"
          git push
